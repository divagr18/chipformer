[package]
name = "engine"
version = "0.1.0"
edition = "2024"

[lib]
name = "chipformer_engine"
crate-type = ["rlib", "cdylib"]

[features]
default = ["safetensors", "window"]
safetensors = ["dep:safetensors"]
window = ["dep:minifb"]

[dependencies]
minifb = { version = "0.29.0", optional = true }
safetensors = { version = "0.8.0", optional = true }
serde_json = "1.0.154"

[[bin]]
name = "play"
required-features = ["window"]

[profile.release]
codegen-units = 1
lto = true
